# Builds, signs and publishes CIMA Box when you push a version tag:
#
#   1. Set the version in CMakeLists.txt, e.g. project(CIMABox VERSION 2.7.0 ...), and add a
#      "## 2.7.0" section to CHANGELOG.md with what changed. Commit.
#   2. git tag v2.7.0
#   3. git push origin main --tags
#
# A few minutes later the release is on GitHub, and everyone's CIMA Box offers the update.
# Needs (once): update_key.txt committed in the repo, and the repository secret
# UPDATE_SIGNING_KEY holding the matching private key. See DEVELOPING.md, "Publishing updates".
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to create the release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in CMakeLists.txt
        shell: bash
        run: |
          v=$(grep -oE 'project\(CIMABox VERSION [0-9]+(\.[0-9]+)*' CMakeLists.txt | grep -oE '[0-9]+(\.[0-9]+)*$')
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME but CMakeLists.txt says $v. Make them the same."
            exit 1
          fi
          awk -v v="$v" '/^## /{ s=$2; sub(/^[vV]/, "", s); p = (s == v); next } p' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## $v' section. Add one with what changed, then tag again."
            exit 1
          fi
          if [ ! -s update_key.txt ]; then
            echo "::error::update_key.txt is missing. Run tools/updates/make-update-key.sh and commit update_key.txt."
            exit 1
          fi

      - name: Build
        shell: bash
        run: |
          cmake -B build -DCIMA_UPDATE_REPO="$GITHUB_REPOSITORY"
          cmake --build build --config Release

      - name: Sign
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The repository secret UPDATE_SIGNING_KEY is missing."
            exit 1
          fi
          printf '%s\n' "$UPDATE_SIGNING_KEY" > signing.pem
          # The private key must belong to the public key built into the program.
          pub=$(openssl ec -in signing.pem -pubout -outform DER 2>/dev/null | tail -c 64 | od -An -tx1 | tr -d ' \n')
          if [ "$pub" != "$(tr -d ' \r\n' < update_key.txt)" ]; then
            rm -f signing.pem
            echo "::error::UPDATE_SIGNING_KEY doesn't match update_key.txt."
            exit 1
          fi
          openssl dgst -sha256 -sign signing.pem -out build/Release/CIMABox.exe.sig build/Release/CIMABox.exe
          rm -f signing.pem

      - name: Zip for new users
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/CIMABox.exe dist/
          Copy-Item -Recurse build/Release/lang dist/lang
          Copy-Item "CIMA Box - Read Me.txt" dist/
          # Always the same name, so github.com/OWNER/REPO/releases/latest/download/CIMABox-windows.zip
          # is a permanent link to the newest version.
          Compress-Archive -Path dist/* -DestinationPath "CIMABox-windows.zip"

      # The optional download behind "Download voice fingerprints" in the app: the speaker-recognition
      # model and the open-source library that runs it (sherpa-onnx with ONNX Runtime, Apache 2.0),
      # fetched from that project's own releases and attached to ours, so the app only ever asks
      # this repository. If this step fails the release still goes out; only that button won't work.
      - name: Voice fingerprint pack
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHERPA_VERSION: v2.0.3
        run: |
          set -euo pipefail
          mkdir -p vp/in vp/out
          gh release download "$SHERPA_VERSION" --repo k2-fsa/sherpa-onnx --dir vp/in \
            --pattern 'sherpa-onnx-v*-win-x64-shared-MT-Release-lib.tar.bz2'
          # (the tag's spelling is theirs)
          gh release download speaker-recongition-models --repo k2-fsa/sherpa-onnx --dir vp/in \
            --pattern 'wespeaker_en_voxceleb_CAM++.onnx'
          tar -xjf vp/in/*.tar.bz2 -C vp/in
          find vp/in -name '*.dll' -exec cp {} vp/out/ \;
          cp 'vp/in/wespeaker_en_voxceleb_CAM++.onnx' vp/out/voice.onnx
          test -f vp/out/sherpa-onnx-c-api.dll
          test -f vp/out/onnxruntime.dll
          ls -la vp/out
          (cd vp/out && 7z a -tzip ../../cimabox-voiceid-win-x64.zip ./* > /dev/null)

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          if [ -f cimabox-voiceid-win-x64.zip ]; then extra="cimabox-voiceid-win-x64.zip"; fi
          gh release create "$GITHUB_REF_NAME" \
            build/Release/CIMABox.exe build/Release/CIMABox.exe.sig CIMABox-windows.zip $extra \
            --title "CIMA Box ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
